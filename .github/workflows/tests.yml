# Nombre del workflow, aparece en la pestaña "Actions" de GitHub
name: Tests

# "on" define CUANDO se ejecuta este workflow
on:
  # Se ejecuta cada vez que haces push a cualquier rama
  push:
  # Tambien se ejecuta cuando se abre/actualiza un Pull Request
  pull_request:

# "permissions" le da permiso al pipeline para escribir resultados como "check" en GitHub
# Sin esto, dorny/test-reporter no podria publicar el resumen
# Va al mismo nivel que "on" y "jobs" (permiso para TODO el workflow)
permissions:
  checks: write
  contents: read

# "jobs" son los trabajos que va a correr (puede haber varios, aqui solo uno)
jobs:
  # Le damos un nombre interno a este trabajo: "test"
  test:
    # Le decimos a GitHub que use una maquina virtual con Ubuntu (Linux) limpia
    runs-on: ubuntu-latest

    # "steps" son los pasos que se ejecutan en orden, uno por uno
    steps:
      # Paso 1: descarga el codigo de tu repo dentro de esa maquina virtual
      - uses: actions/checkout@v4

      # Paso 2: instala Python en esa maquina virtual
      - uses: actions/setup-python@v5
        with:
          # Version de Python a instalar (misma que usamos localmente)
          python-version: "3.12"

      # Paso 3: instala las librerias que necesita el proyecto
      - name: Instalar dependencias
        run: pip install pytest boto3 moto

      # Paso 4: corre todos los tests con pytest, en modo detallado (-v)
      - name: Correr tests
        # --junitxml genera un archivo XML con los resultados, en formato estandar
        run: pytest -v --junitxml=results.xml

      # Paso 5: lee results.xml y publica un resumen visual en el workflow
      - name: Publicar resumen de tests
        uses: dorny/test-reporter@v1
        # "if: always()" hace que este paso corra AUNQUE el paso anterior haya fallado
        # (asi puedes ver el resumen incluso si algun test falla)
        if: always()
        with:
          # Nombre que aparecera en el resumen
          name: Resultados de Pytest
          # Ruta del archivo generado en el paso anterior
          path: results.xml
          # Formato del archivo (pytest genera XML estilo JUnit)
          reporter: java-junit
