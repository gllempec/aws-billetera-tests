# Nombre del workflow, aparece en la pestaña "Actions" de GitHub
name: Tests

# "on" define CUANDO se ejecuta este workflow
on:
  # Se ejecuta cada vez que haces push a cualquier rama
  push:
  # Tambien se ejecuta cuando se abre/actualiza un Pull Request
  pull_request:

# "jobs" son los trabajos que va a correr (puede haber varios, aqui solo uno)
jobs:
  # Le damos un nombre interno a este trabajo: "test"
  test:
    # Le decimos a GitHub que use una maquina virtual con Ubuntu (Linux) limpia
    runs-on: ubuntu-latest

    # "steps" son los pasos que se ejecutan en orden, uno por uno
    steps:
      # Paso 1: descarga el codigo de tu repo dentro de esa maquina virtual
      - uses: actions/checkout@v4

      # Paso 2: instala Python en esa maquina virtual
      - uses: actions/setup-python@v5
        with:
          # Version de Python a instalar (misma que usamos localmente)
          python-version: "3.12"

      # Paso 3: instala las librerias del proyecto + allure-pytest (plugin de reporte)
      - name: Instalar dependencias
        run: pip install pytest boto3 moto allure-pytest

      # Paso 4: corre los tests y guarda los resultados "crudos" para Allure
      - name: Correr tests
        # --alluredir genera una carpeta con archivos JSON, uno por test
        run: pytest -v --alluredir=allure-results

      # Paso 5: convierte esos archivos JSON en un reporte HTML visual de Allure
      # (esta action incluye Java + el CLI de Allure, no necesitas instalarlos)
      - name: Generar reporte Allure
        uses: simple-elf/allure-report-action@v1.9
        # "if: always()" para generar el reporte aunque algun test haya fallado
        if: always()
        with:
          allure_results: allure-results
          allure_report: allure-report

      # Paso 6: sube el reporte HTML como "artifact" descargable desde el run
      - name: Subir reporte Allure
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report
