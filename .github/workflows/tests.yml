# Nombre del workflow, aparece en la pestaña "Actions" de GitHub
name: Tests

# "on" define CUANDO se ejecuta este workflow
on:
  # Se ejecuta cada vez que haces push a cualquier rama
  push:
  # Tambien se ejecuta cuando se abre/actualiza un Pull Request
  pull_request:

# "jobs" son los trabajos que va a correr (puede haber varios, aqui solo uno)
jobs:
  # Le damos un nombre interno a este trabajo: "test"
  test:
    # Le decimos a GitHub que use una maquina virtual con Ubuntu (Linux) limpia
    runs-on: ubuntu-latest

    # "steps" son los pasos que se ejecutan en orden, uno por uno
    steps:
      # Paso 1: descarga el codigo de tu repo dentro de esa maquina virtual
      - uses: actions/checkout@v4

      # Paso 2: instala Python en esa maquina virtual
      - uses: actions/setup-python@v5
        with:
          # Version de Python a instalar (misma que usamos localmente)
          python-version: "3.12"

      # Paso 3: instala las librerias del proyecto + allure-pytest (plugin de reporte)
      - name: Instalar dependencias
        run: pip install pytest boto3 moto allure-pytest

      # Paso 4: corre los tests y guarda los resultados "crudos" para Allure
      - name: Correr tests
        # --alluredir genera una carpeta con archivos JSON, uno por test
        # if: always() no aplica aqui (es el primer paso que puede fallar)
        run: pytest -v --alluredir=allure-results

      # Paso 5: descarga el CLI de Allure (un programa Java, sin Docker)
      # Ubuntu ya trae Java instalado, asi que solo descargamos y descomprimimos
      - name: Instalar Allure CLI
        if: always()
        run: |
          curl -o allure.tgz -Ls https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz
          tar -zxf allure.tgz -C /opt/
          sudo ln -s /opt/allure-2.29.0/bin/allure /usr/local/bin/allure

      # Paso 6: convierte los JSON de allure-results en un reporte HTML
      - name: Generar reporte Allure
        if: always()
        run: allure generate allure-results -o allure-report --clean

      # Paso 7: sube el reporte HTML como "artifact" descargable desde el run
      - name: Subir reporte Allure
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report

  # Segundo job: prueba de performance con k6.
  # Como NO tiene "needs:", corre EN PARALELO con el job "test" (los dos arrancan al mismo tiempo)
  performance:
    runs-on: ubuntu-latest

    steps:
      # Descargamos el codigo del repo (necesitamos performance/load_test.js)
      - uses: actions/checkout@v4

      # grafana/k6-action instala k6 (sin Docker) y corre el script indicado.
      # Si algun "threshold" del script falla, este paso (y el job) fallan: eso convierte
      # a la performance en un "gate" mas del pipeline, igual que los tests funcionales
      - name: Correr prueba de carga con k6
        uses: grafana/k6-action@v0.3.1
        with:
          filename: performance/load_test.js
